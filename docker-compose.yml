# League Persua — infra local + app
#
# Só infra local (npm run dev no host):
#   npm run infra:up
#   Postgres host :5436 · Redis host :6380
#
# Servidor (Postgres compartilhado + Redis deste compose + app):
#   /home/garcon/infra/postgres/scripts/criar-servico.sh league_persua
#   docker compose --profile app up -d --build
#   App em http://localhost:3001 (3000 fica com o FinOps)

services:
  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: league_persua
      POSTGRES_PASSWORD: league_persua_dev
      POSTGRES_DB: league_persua
    ports:
      - "5436:5432"
    volumes:
      - league_persua_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U league_persua -d league_persua"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-league_persua_redis_dev}"]
    ports:
      - "6380:6379"
    volumes:
      - league_persua_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-league_persua_redis_dev}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:build@postgres:5432/league_persua?schema=public}
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://:${REDIS_PASSWORD:-league_persua_redis_dev}@redis:6379}
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      RIOT_DEFAULT_REGION: ${RIOT_DEFAULT_REGION:-br1}
      RIOT_APP_ID: ${RIOT_APP_ID:-364635}
      LIVE_AGENT_TOKEN: ${LIVE_AGENT_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - servicos

volumes:
  league_persua_pg:
  league_persua_redis:

networks:
  servicos:
    external: true
